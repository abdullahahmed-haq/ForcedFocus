name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.14
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --requirement requirements/dev.lock
      - run: npm ci --prefix web
      - run: make check PYTHON=python
      - run: make build-web
      - run: swiftc -parse menubar/forcefocus_menubar.swift
      - run: plutil -lint daemon/com.forcefocus.daemon.plist
      - run: bash -n install.sh uninstall.sh scripts/sync_shared.sh menubar/build_menubar.sh

  architecture-smoke:
    strategy:
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: uname -m
      - run: swiftc -parse menubar/forcefocus_menubar.swift
      - run: bash scripts/sync_shared.sh --check
