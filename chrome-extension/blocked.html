<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="icons/forbidden.png" />
    <title>Blocked — ForcedFocus</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./shared/tokens.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary, #040408);
        font-family: var(--ff-font);
        font-size: var(--ff-type-body);
        line-height: var(--ff-leading-normal);
        font-synthesis: none;
        color: var(--text-primary, #fcfcfd);
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
      }
      body::before,
      body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.15;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        width: 600px;
        height: 600px;
        background: #6366f1;
        top: -200px;
        right: -200px;
      }
      body::after {
        width: 500px;
        height: 500px;
        background: #8b5cf6;
        bottom: -150px;
        left: -150px;
      }
      .container {
        position: relative;
        z-index: 1;
        text-align: center;
        width: min(500px, calc(100% - 2rem));
        padding: clamp(1.5rem, 6vw, 3rem);
        background: var(--bg-secondary, #08080f);
        border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
        border-radius: var(--radius, 16px);
      }
      .icon {
        font-size: 5rem;
        margin-bottom: 1.5rem;
        filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.3));
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
      }
      h1 {
        font-size: var(--ff-type-display);
        line-height: var(--ff-leading-tight);
        font-weight: 800;
        margin-bottom: 0.5rem;
        color: var(--danger, #f43f5e);
      }
      .domain {
        font-size: var(--ff-type-title);
        color: var(--text-secondary, #94a3b8);
        margin-bottom: 2rem;
        font-family: var(--ff-font);
        padding: 0.5rem 1rem;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        display: inline-block;
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .message {
        font-size: var(--ff-type-body);
        color: var(--text-secondary, #94a3b8);
        line-height: 1.6;
      }
      .badge {
        display: inline-block;
        padding: 0.5rem 1.2rem;
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border-radius: var(--radius-sm, 12px);
        font-size: var(--ff-type-label);
        font-weight: 600;
        margin-top: 1.5rem;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="icon" aria-hidden="true">🛡️</div>
      <h1>Site Blocked</h1>
      <div class="domain" id="blockedDomain">—</div>
      <p class="message">
        This site is blocked by ForcedFocus.<br />
        Stay focused — you've got this! 💪
      </p>
      <div class="badge">ForcedFocus active</div>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
