[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forcedfocus"
version = "1.0.0"
description = "A high-integrity macOS focus enforcement utility."
readme = "README.md"
requires-python = "==3.13.14"
license = {text = "MIT"}
authors = [{name = "ForcedFocus contributors"}]
dependencies = ["rich>=13.9,<14"]

[project.scripts]
forcefocus = "cli.main:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools]
packages = ["forcefocus", "cli", "cli.commands"]
package-dir = {forcefocus = "daemon/forcefocus", cli = "cli"}

[tool.pytest.ini_options]
testpaths = ["daemon/tests"]
pythonpath = ["daemon", "."]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["daemon/forcefocus", "daemon/forcefocus_daemon.py", "cli"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["scripts/archive"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
files = [
  "daemon/forcefocus/command_service.py",
  "daemon/forcefocus/state.py",
  "daemon/forcefocus/state_store.py",
  "daemon/forcefocus/version.py",
]
exclude = ["scripts/archive"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
